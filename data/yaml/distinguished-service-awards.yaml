# ACL Distinguished Service Award recipients.
# Source: https://www.aclweb.org/adminwiki/index.php?title=ACL_DSA_Winners

2025:
  - id: julia-hirschberg
    award_url: https://www.aclweb.org/portal/content/announcement-2025-acl-lifetime-achievement-award-and-dragomir-radev-distinguished-service
    reason: >-
      For 35 years of dedicated service to ACL and the broader language and
      speech communities, including leadership of Computational Linguistics
      and service on the ACL Executive Committee.

# No award was given in 2024.

2023:
  - id: joakim-nivre
    award_url: https://www.aclweb.org/portal/content/joakim-nivre-receives-2023-acl-dragomir-radev-distinguished-service-award
    reason: >-
      For more than two decades of sustained leadership and organizational
      service across ACL, EACL, SIGNLL, conferences, workshops, and the wider
      computational linguistics community.

2022:
  - id: dragomir-radev
    award_url: https://www.aclweb.org/portal/content/dragomir-radev-receives-2022-acl-distinguished-service-award
    reason: >-
      For nearly two decades of sustained ACL leadership and service,
      including work as ACL secretary, NAACL treasurer, and co-founder and
      organizer of the North American Computational Linguistics Open
      Competition.

2021:
  - id: lillian-lee
    award_url: https://www.aclweb.org/portal/content/lillian-lee-receives-2021-acl-distinguished-service-award
    reason: >-
      For sustained leadership of Transactions of the ACL, including service
      as Editor in Chief from 2013 to 2019 and foundational work establishing
      the journal's policies, operations, and continued growth.

2020:
  - id: graeme-hirst
    award_url: https://www.aclweb.org/portal/content/graeme-hirst-receives-2020-acl-distinguished-service-award
    reason: >-
      For extensive service to ACL as treasurer, longtime book review editor
      of Computational Linguistics, NAACL leader, and co-leader of the
      Professional Conduct Committee.

2019:
  - id: min-yen-kan
    award_url: https://www.aclweb.org/portal/content/announcement-2019-acl-distinguished-service-award-dsa
    reason: >-
      For a decade of stewardship as ACL Anthology Editor, modernizing the
      Anthology while expanding its publication coverage, metadata, media, and
      support for the computational linguistics community.
