{{/* OpenReview profile field of a "Fix author" form; `.prefix` starts the field ID,
     which author-correction.js looks up. */}}
<div class="mb-3">
  <label for="{{ .prefix }}OpenReviewProfile" class="form-label">OpenReview profile URL <span class="text-danger">*</span></label>
  <input type="text" class="form-control" id="{{ .prefix }}OpenReviewProfile" placeholder="https://openreview.net/profile?id=~Your_Name1">
  <div class="form-text">Enter "none" if you don't have an OpenReview profile.</div>
</div>
