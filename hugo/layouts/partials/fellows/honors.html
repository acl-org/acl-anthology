<div class="acl-fellow-honors">
  {{ with .fellow_year }}
  <span class="acl-fellow-year">ACL Fellow, {{ . }}</span>
  {{ end }}
  {{ with .lifetime_achievement_award_year }}
  <span class="acl-fellow-year">ACL Lifetime Achievement Award, {{ . }}</span>
  {{ end }}
</div>
<div class="acl-fellow-details">
  {{ partial "fellows/citation.html" . }}
  {{ partial "fellows/acceptance-speech.html" . }}
</div>
