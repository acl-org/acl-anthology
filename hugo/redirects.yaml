# Permanent and temporary redirects for URLs that have escaped into the wild.
# See docs/redirects.md before adding an entry.
version: 1

batches:
  - added: 2026-09-09
    issues:
      - 9364
      - 9908
    redirects:
      # LREC 2026 was previewed with the volume name "main", then published as "1".
      - match: regex
        from: '^/2026\.lrec-main(?=\.|/|$)(.*)$'
        to: '/2026.lrec-1$1'
        tests:
          - from: /2026.lrec-main.104/
            to: /2026.lrec-1.104/
          - from: /2026.lrec-main.104.pdf
            to: /2026.lrec-1.104.pdf
          - from: /2026.lrec-main.pdf
            to: /2026.lrec-1.pdf
          - from: /2026.lrec-main.104.bib
            to: /2026.lrec-1.104.bib

      - match: regex
        from: '^/volumes/2026\.lrec-main(?=\.|/|$)(.*)$'
        to: '/volumes/2026.lrec-1$1'
        tests:
          - from: /volumes/2026.lrec-main/
            to: /volumes/2026.lrec-1/
          - from: /volumes/2026.lrec-main.bib
            to: /volumes/2026.lrec-1.bib

      - match: regex
        from: '^/(attachments|thumb)/2026\.lrec-main(?=\.|/|$)(.*)$'
        to: '/$1/2026.lrec-1$2'
        tests:
          - from: /attachments/2026.lrec-main.104.Poster.pdf
            to: /attachments/2026.lrec-1.104.Poster.pdf
          - from: /thumb/2026.lrec-main.104-trimmed.jpg
            to: /thumb/2026.lrec-1.104-trimmed.jpg

      - match: regex
        direct: true
        from: '^/anthology-files/pdf/lrec/2026\.lrec-main(?=\.|/|$)(.*)$'
        to: '/2026.lrec-1$1'
        tests:
          - from: /anthology-files/pdf/lrec/2026.lrec-main.104.pdf
            to: /2026.lrec-1.104.pdf

      - match: regex
        direct: true
        from: '^/anthology-files/attachments/lrec/2026\.lrec-main(?=\.|/|$)(.*)$'
        to: '/attachments/2026.lrec-1$1'
        tests:
          - from: /anthology-files/attachments/lrec/2026.lrec-main.104.Poster.pdf
            to: /attachments/2026.lrec-1.104.Poster.pdf

      - match: regex
        direct: true
        from: '^/anthology-files/videos/lrec/2026\.lrec-main(?=\.|/|$)(.*)$'
        to: '/2026.lrec-1$1'
        tests:
          - from: /anthology-files/videos/lrec/2026.lrec-main.104.mp4
            to: /2026.lrec-1.104.mp4

      - match: regex
        direct: true
        from: '^/anthology-files/thumb/2026\.lrec-main(?=\.|/|$)(.*)$'
        to: '/thumb/2026.lrec-1$1'
        tests:
          - from: /anthology-files/thumb/2026.lrec-main.104-trimmed.jpg
            to: /thumb/2026.lrec-1.104-trimmed.jpg

      # Physical storage paths are implementation details. Strip their shard
      # directories and redirect direct requests to the public URL families.
      - match: regex
        direct: true
        from: '^/anthology-files/(?:pdf|videos|handbooks)/(?:[^/]+/)*([^/]+)$'
        to: '/$1'
        tests:
          - from: /anthology-files/pdf/P/P17/P17-1069.pdf
            to: /P17-1069.pdf
          - from: /anthology-files/pdf/acl/2025.acl-long.1.pdf
            to: /2025.acl-long.1.pdf
          - from: /anthology-files/videos/N/N13-1001.mp4
            to: /N13-1001.mp4
          - from: /anthology-files/videos/acl/2021.acl-long.1.mp4
            to: /2021.acl-long.1.mp4
          - from: /anthology-files/handbooks/acl/2026.acl.handbook.pdf
            to: /2026.acl.handbook.pdf

      - match: regex
        direct: true
        from: '^/anthology-files/attachments/(?:[^/]+/)*([^/]+)$'
        to: '/attachments/$1'
        tests:
          - from: /anthology-files/attachments/P/P17/P17-1069.Poster.pdf
            to: /attachments/P17-1069.Poster.pdf
          - from: /anthology-files/attachments/acl/2025.acl-long.1.SupplementaryMaterial.zip
            to: /attachments/2025.acl-long.1.SupplementaryMaterial.zip

      - match: regex
        direct: true
        from: '^/anthology-files/thumb/(?:[^/]+/)*([^/]+)$'
        to: '/thumb/$1'
        tests:
          - from: /anthology-files/thumb/P17-1069.jpg
            to: /thumb/P17-1069.jpg
          - from: /anthology-files/thumb/2025.acl-long.1-trimmed.jpg
            to: /thumb/2025.acl-long.1-trimmed.jpg

      - match: prefix
        direct: true
        from: /anthology-files/files/
        to: /files/
        tests:
          - from: /anthology-files/files/acl-2025/program.pdf
            to: /files/acl-2025/program.pdf

      - direct: true
        from: /anthology-files/templates/acl-copyright-transfer.pdf
        to: /acl-copyright-transfer.pdf

      # Older imports predate the current pdf/ and attachments/ sharding.
      # Attachment-shaped names must precede the general PDF rule.
      - match: regex
        direct: true
        from: '^/anthology-files/(?:earlymt|mtsummit)/(\d{4}\.[a-zA-Z\d]+-[a-zA-Z\d]+\.[a-zA-Z\d]+\.[^/.]+\.[^/]+)$'
        to: '/attachments/$1'
        tests:
          - from: /anthology-files/earlymt/1961.earlymt-1.3.Presentation.pdf
            to: /attachments/1961.earlymt-1.3.Presentation.pdf
          - from: /anthology-files/mtsummit/2005.mtsummit-invited.10.Presentation.pdf
            to: /attachments/2005.mtsummit-invited.10.Presentation.pdf

      - match: regex
        direct: true
        from: '^/anthology-files/(?:earlymt|mtsummit)/([^/]+\.pdf)$'
        to: '/$1'
        tests:
          - from: /anthology-files/earlymt/1956.earlymt-1.9.pdf
            to: /1956.earlymt-1.9.pdf
          - from: /anthology-files/mtsummit/1999.mtsummit-1.37.pdf
            to: /1999.mtsummit-1.37.pdf

      - match: regex
        direct: true
        from: '^/anthology-files/vimeo_videos/videos/(?:[^/]+/)*([^/]+)$'
        to: '/$1'
        tests:
          - from: /anthology-files/vimeo_videos/videos/N15/N15-1005.mp4
            to: /N15-1005.mp4
