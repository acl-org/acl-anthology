name: Submission of New Volume or Venue
description: Submit a request to add new conference proceedings or journal issues to the ACL Anthology.
title: "Ingestion Request: {replace with name of event}"
labels: ["ingestion"]
assignees:
  - anthology-assist
body:
  - type: checkboxes
    id: ingestion_info
    attributes:
      label: General information about this request
      description: |
        Open this issue early; provisional information is welcome. An action will add a personalized checklist and timeline afterwards. Keep your answers current and check off completed tasks in that checklist. We will mention you seven days before unfinished deadlines and daily once overdue.
        Colocated workshop chairs should coordinate through their main conference publication chairs and their issue.
        Detailed instructions remain in our [information for submitters](https://aclanthology.org/info/contrib/).
      options:
        - label: I will keep this issue up to date and check off the submission tasks as they are completed.
          required: true
        - label: "This request includes a **new venue** that does not exist in the ACL Anthology yet (including any new workshop venues)."
        - label: This submission is historical material, rather than current proceedings or a current journal issue.
  - type: input
    id: venue_id
    attributes:
      label: Venue Identifier
      description: |
        What is the (proposed) venue identifier for this submission? If you are not sure what the correct identifier for your venue is, you can look it up in the [list of existing venues](https://aclanthology.org/venues/). A provisional identifier or "TBD" is fine when registering early.
      placeholder: ex. emnlp, repl4nlp, or TBD
    validations:
      required: true
  - type: dropdown
    id: acl_organized
    attributes:
      label: ACL-organized Event
      description: Is this event organized by the ACL or an ACL chapter? This determines the ISBN instructions; do not answer based only on whether the Anthology hosts the venue.
      options:
        - "Yes"
        - "No"
        - Not sure yet
      default: 2
    validations:
      required: true
  - type: input
    id: venue_sig
    attributes:
      label: "ACL SIG(s) sponsoring or endorsing the whole venue"
      description: |
        Provide a comma-separated list of any SIGs that apply to the whole venue. If there are multiple subvenues/volumes with different SIGs, provide the mapping under Supporting Information.
      placeholder: ex. SIGLEX, SIGSEM
  - type: input
    id: volume_title
    attributes:
      label: Volume Title
      description: |
        What is the title of the (main) volume that should be published? A provisional title is fine; update it once agreed.
      placeholder: ex. Proceedings of the 2019 Meeting of the Conference on Empirical Methods in Natural Language Processing (EMNLP)
    validations:
      required: true
  - type: input
    id: venue_name
    attributes:
      label: "Venue Name (only if you are submitting a new venue)"
      description: |
        What is the name of the venue?  Note that this should be a general name that **does _not_ include** numbers or years.
      placeholder: ex. Conference on Empirical Methods in Natural Language Processing
  - type: input
    id: venue_website
    attributes:
      label: "Venue Website (only if you are submitting a new venue)"
      description: |
        What is the website of the venue?  Ideally provide a link for the venue itself, _not_ a particular meeting of the venue.
      placeholder: ex. https://sigdat.org/
  - type: input
    id: volume_date
    attributes:
      label: Date of Publication
      description: |
        When would you like the material to be published on the ACL Anthology? If you are submitting material that can be published immediately (e.g. for conferences that already happened in the past), you can leave this field blank.
      placeholder: YYYY-MM-DD
  - type: input
    id: cutoff_date
    attributes:
      label: Proceedings Cutoff Date
      description: |
        If agreed, when will you freeze the versioned proceedings snapshot? Use YYYY-MM-DD. This must be no later than the delivery deadline (two weeks before publication). Leave blank if not yet agreed.
      placeholder: YYYY-MM-DD
  - type: input
    id: volume_address
    attributes:
      label: Location
      description: |
        What address should be included in bibliography entries, if any? For conferences this is the location of the conference. For a fully-online event use "Online", optionally following the host team location. Ensure the address field is consistent across submitted volumes.
      placeholder: ex. Barcelona, Spain (Online)
  - type: checkboxes
    id: submission_platform
    attributes:
      label: Submission Platform(s)
      description: Which of the following will you use to collect submissions?
      options:
        - label: OpenReview (proceedings compiled with [aclpub2](https://github.com/rycolab/aclpub2/))
        - label: Softconf/START (export the proceedings in ACLPUB format; no need to convert with aclpub2)
        - label: EasyChair (direct ingestion export; arrange to include ORCID iDs in its metadata)
        - label: Other (explain)
  - type: checkboxes
    id: orcid_request
    attributes:
      label: ORCID iDs
      description: The Anthology expects ORCID iDs for as many authors as possible. Verify that collected iDs are included in the ingestion metadata, particularly with EasyChair; profiles alone are not enough.
      options:
        - label: We will request author ORCID iDs and include them in the ingestion metadata ([instructions](https://aclanthology.org/info/orcid/)). Historical material is exempt.
          required: true
  - type: checkboxes
    id: delivery_method
    attributes:
      label: Delivery Method
      description: Once the proceedings are compiled, how will you deliver them to the Anthology?
      options:
        - label: Private Github repo (preferred)
        - label: wget-able web link (HTTP, FTP)
        - label: Proprietary file sharing service (Google Drive or Dropbox)
  - type: textarea
    id: ingestion_information
    attributes:
      label: Supporting Information
      description: |
        If there is anything else we should know about this ingestion request, please provide the information here. E.g. for venues with multiple volumes, list them with the volume identifier, volume title, and any SIGs for the volume. You can also use this field to **provide links or attach files** of the material, if you already have them.
