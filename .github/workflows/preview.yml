# Builds a preview of a branch's associated pull request and publishes it to
# https://preview.aclanthology.org/BRANCHNAME
#
# This only runs for open PRs carrying the "preview" label, since a full preview
# build is expensive. Removing the label stops further builds on subsequent
# pushes; adding it (re-)triggers one.
#
# The "preview" label is added automatically on PR creation/title-edit for PR
# types that reliably need one (e.g. ingestion PRs, metadata correction
# PRs). For anything else, add the "preview" label to the PR manually to request
# a build.
#
# PRs coming from forks never get preview builds for security reasons – this
# workflow will post a notice on the PR to clarify this if a preview would
# otherwise be expected.

name: Create website preview

on:
  pull_request:
    types: [opened, edited, synchronize, labeled]
    branches:
    - master

# only run one at a time per PR
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Decides whether `preview` should build before instantiating an expensive
  # runner, and auto-attaches the "preview" label for PR types that reliably
  # need one:
  #   - ingestion PRs (title starts with "ingest")
  #   - metadata correction PRs (title contains "corrections")
  decide:
    # If we're running from a "labeled" event, only continue if the label is "preview"
    if: github.event.action != 'labeled' || github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      fork_notice: ${{ steps.check.outputs.fork_notice }}
    steps:
      - id: check
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            const title = pr.title;

            // Matches ingestions and corrections
            const matchesKeywords = /^ingest\b/i.test(title) || /corrections/i.test(title);
            const hasLabel = pr.labels.some(l => l.name === 'preview');
            const isSameRepo = pr.head.repo?.full_name === pr.base.repo.full_name;

            // Should this event result in a preview build?
            //  - If the "preview" label is present, build on anything except
            //    a bare "edited" (so an unrelated title/body edit doesn't
            //    re-trigger a build).
            //  - If the "preview" label is not present, but the event is
            //    "opened"/"edited", a direct keyword match on the title decides
            //    if the label is added + the preview is built.
            const shouldBuild = hasLabel
              ? action !== 'edited'
              : (action === 'opened' || action === 'edited') && matchesKeywords;
            core.setOutput('should_build', (shouldBuild && isSameRepo).toString());

            // Add the "preview" label, if applicable. ---
            // Implementation note: This should NOT retrigger this workflow
            // (via the `labeled` event) as per GitHub's docs here:
            // <https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow>
            if (matchesKeywords && !hasLabel && (action === 'opened' || action === 'edited') && isSameRepo) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['preview'],
              });
            }

            // Forks never get a preview build -- if one would be expected,
            // post a notice instead of silently doing nothing.
            core.setOutput('fork_notice', (!isSameRepo && shouldBuild).toString());

      - name: Post notice on PRs from forks
        if: steps.check.outputs.fork_notice == 'true'
        uses: mshick/add-pr-comment@v3
        with:
          message-id: fork-preview-notice
          message: |
            This PR would normally get a website preview build (based on its title or the `preview` label), but since it comes from a fork, one can't be built automatically for security reasons.

            A maintainer can build one manually by checking out the branch locally.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allow-repeats: false

  preview:
    needs: decide
    # IMPORTANT: `head.repo.full_name == github.repository` restricts this to
    # PRs from branches within our own repo. Do not remove this check: this job
    # runs arbitrary repo code (`make check site preview`) and publishes with a
    # secret SSH key, so it must never run against a fork's code.
    if: >
      needs.decide.outputs.should_build == 'true' &&
      github.repository == 'acl-org/acl-anthology' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref != 'master'
    runs-on:
      labels: ubuntu-latest-m
    steps:
    - uses: actions/checkout@v7
      with:
        # Check out the PR's actual head commit (not the ephemeral merge
        # commit that `pull_request` checks out by default), so the preview
        # reflects exactly what's on the branch.
        ref: ${{ github.event.pull_request.head.sha }}

    - id: prerequisites
      uses: ./.github/actions/install-build-prerequisites

    - name: Dump secret key
      env:
        SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
      run: |
        mkdir -p $HOME/.ssh/
        echo "$SSH_KEY" > $HOME/.ssh/id_rsa
        chmod 600 $HOME/.ssh/id_rsa

    - name: Fetch master branch
      run: |
        git fetch origin master
    - name: Extract branch name
      shell: bash
      run: |
        raw_branch="${GITHUB_HEAD_REF}"
        branch="${raw_branch//\//___}"
        echo "branch=$(echo ${branch})" >> $GITHUB_OUTPUT
      id: extract_branch
    - name: List changes
      shell: bash
      run: echo "changes=$(git diff --name-only HEAD origin/master | python ./bin/get_changes_from_git_diff.py https://preview.aclanthology.org/${{ steps.extract_branch.outputs.branch }})" >> $GITHUB_OUTPUT
      id: list_changes
#    - name: list volumes debug
#      shell: bash
#      run: |
#        git diff --name-only HEAD origin/master
#        git diff --name-only HEAD origin/master | python ./bin/volumes_from_diff.py https://preview.aclanthology.org/${{ steps.extract_branch.outputs.branch }}
    - name: Build website preview
      shell: bash
      env:
        ANTHOLOGY_PREFIX: https://preview.aclanthology.org/${{ steps.extract_branch.outputs.branch }}
        HUGO_PARAMS_PREVIEWPRURL: ${{ github.event.pull_request.html_url }}
      run: |
        make NOBIB=true ANTHOLOGY_PREFIX=${ANTHOLOGY_PREFIX} check site preview
    - uses: mshick/add-pr-comment@v3
      with:
        # this causes pushes to update the old message, instead of generating a new one
        message-id: preview
        message: |
          Build successful. Some useful links:
          * Complete site preview: https://preview.aclanthology.org/${{ steps.extract_branch.outputs.branch }}
          * Potential changes of interest: ${{ steps.list_changes.outputs.changes }}

          This preview will be removed when the branch is merged.
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        allow-repeats: false
    - name: Notify ingestion reviewers of preview
      uses: actions/github-script@v9
      with:
        script: |
          const pr = context.payload.pull_request;
          if (!/^ingest\b/i.test(pr.title)) return;

          const body = pr.body || '';
          const previewUrl = 'https://preview.aclanthology.org/${{ steps.extract_branch.outputs.branch }}';
          const previewHeading = 'Navigate to the preview site and check the following:';
          const linkedPreviewHeading = `Navigate to [the preview](${previewUrl}) site and check the following:`;
          const updated = body.replace(
            previewHeading,
            linkedPreviewHeading
          );
          if (updated !== body) {
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: updated,
            });
          }

          const lines = updated.split(/\r?\n/);
          const blockStart = lines.findIndex(line => line.trim() === linkedPreviewHeading);
          if (blockStart === -1) return;

          let blockEnd = blockStart + 1;
          while (blockEnd < lines.length && lines[blockEnd].trim() !== '') {
            blockEnd += 1;
          }
          const previewBlock = lines.slice(blockStart, blockEnd).join('\n');

          const result = await github.graphql(
            `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 20) {
                    nodes {
                      number
                      repository {
                        name
                        owner {
                          login
                        }
                      }
                    }
                  }
                }
              }
            }`,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number,
            }
          );

          const marker = `<!-- ingestion-preview-pr-${pr.number} -->`;
          const commentBody = [
            'A preview has been generated that requires your attention.',
            '',
            previewBlock,
            '',
            'The preview will be merged once you have completed the checklist.',
            '',
            marker,
          ].join('\n');

          for (const issue of result.repository.pullRequest.closingIssuesReferences.nodes) {
            const issueOwner = issue.repository.owner.login;
            const issueRepo = issue.repository.name;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: issueOwner,
              repo: issueRepo,
              issue_number: issue.number,
              per_page: 100,
            });
            if (comments.some(comment => (comment.body || '').includes(marker))) {
              continue;
            }

            await github.rest.issues.createComment({
              owner: issueOwner,
              repo: issueRepo,
              issue_number: issue.number,
              body: commentBody,
            });
          }
