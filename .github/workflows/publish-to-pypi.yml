name: Tag & publish to PyPI

on:
  push:
    branches:
      - master
    paths:
      - 'python/pyproject.toml'
      - 'python/CHANGELOG.md'
  pull_request:   # to run the "check" step already on PRs
    branches:
      - master
    paths:
      - 'python/pyproject.toml'
      - 'python/CHANGELOG.md'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to post a release notice on the PR
    outputs:
      version: ${{ steps.check-pypi-release.outputs.version }}
      is-new: ${{ steps.check-pypi-release.outputs.is-new }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: 3.14
          ignore-nothing-to-cache: true

      - name: Check if this version is new
        id: check-pypi-release
        uses: ./.github/actions/check-pypi-release

      - name: Verify CHANGELOG.md was updated
        if: steps.check-pypi-release.outputs.is-new == 'true'
        working-directory: python
        run: |
          VERSION="${{ steps.check-pypi-release.outputs.version }}"
          if ! head -n 10 CHANGELOG.md | grep -qF "[$VERSION]"; then
            echo "::error::CHANGELOG.md does not mention [$VERSION] in its first 10 lines."
            echo "Expected a heading like: ## [$VERSION] — ..."
            exit 1
          fi

      - name: Post or update release notice
        if: github.event_name == 'pull_request' && steps.check-pypi-release.outputs.is-new == 'true'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const version = "${{ steps.check-pypi-release.outputs.version }}";
            const marker = "<!-- release-notice -->";
            const body = `${marker}\n🚀 Merging this PR will publish **v${version}** of the **acl-anthology** package to PyPI and create a new Git tag \`py-v${version}\`.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === "Bot" && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  release:
    needs: check
    if: needs.check.outputs.is-new == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write   # required for trusted publishing
      contents: write   # for pushing a new tag
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: 3.14

      - name: Build wheel
        working-directory: python
        run: uv build

      - name: Publish to PyPI
        run: uv publish

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "py-v${{ needs.check.outputs.version }}"
          git push origin "py-v${{ needs.check.outputs.version }}"
