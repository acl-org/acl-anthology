[project]
name = "aclanthology.org"
version = "2026.2.1"
requires-python = ">=3.11"
dependencies = [
    "acl-anthology",
    "docopt-ng>=0.9.0",
    "filetype>=1.2.0",
    "gitpython>=3.2.1",
    "iso-639==0.4.5",
    "jsonschema>=4.26.0",
    "lxml>=6.1.0",
    "markdown-it-py[linkify]>=4.2.0",
    "msgspec>=0.22.0",
    "nltk>=3.10.4",
    "openreview-py>=2.9.1",
    "pre-commit>=4.7.0",
    "pybtex>=0.26.1",
    "pygithub>=2.8.1",
    "pypdf>=6.21.2",
    "pytest>=9.0.2",
    "python-dateutil>=3.0.0",
    "reportlab>=5.1.0",
    "rich>=14.3.2",
    "texsoup~=0.3.1",
]

[tool.uv.sources]
acl-anthology = { workspace = true }

[tool.uv.workspace]
members = ["python"]

[tool.ruff]
line-length = 90
target-version = 'py311'
